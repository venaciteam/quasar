<!DOCTYPE html>
<html lang="fr" data-accent="rose">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quasar — Connexion</title>
    <link rel="stylesheet" href="/dashboard/css/vnct-design-system.css?v=__VERSION__">
    <link rel="stylesheet" href="/dashboard/css/style.css?v=__VERSION__">
    <link rel="stylesheet" href="/dashboard/css/vnct-fab-only.css?v=__VERSION__">
    <link rel="icon" type="image/x-icon" href="/dashboard/icon.ico">
    <link rel="icon" type="image/png" href="/dashboard/icon.png">
    <link rel="apple-touch-icon" href="/dashboard/icon.png">
    <link rel="manifest" href="/dashboard/manifest.json">
    <meta name="theme-color" content="#0a0a0f">
</head>
<body>
    <div class="landing" id="landing">
        <div class="landing-top">
            <button class="theme-toggle" onclick="VNCT.Theme.toggle()" aria-label="Changer de theme">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </button>
        </div>
        <div class="landing-logo">Qua<span>sar</span></div>
        <p class="landing-subtitle">Connecte-toi pour acceder au dashboard</p>

        <a href="/auth/login" class="landing-btn">
            <img src="/dashboard/img/discord-logo.png" style="width:22px;height:22px;filter:brightness(0) invert(1)" alt="">
            Se connecter avec Discord
        </a>
    </div>

    <!-- Le panneau « Késako » qui vivait ici a été retiré : le bouton flottant
         qui l'ouvrait n'existe plus depuis le passage au drapeau de signalement,
         et le <template> ne servait donc plus qu'à emprisonner deux mentions
         obligatoires — le lien vers le code source de cette instance (AGPL-3.0,
         article 13) et l'identité de qui l'héberge. Ces deux mentions sont
         maintenant écrites dans le badge de version, visible en permanence en
         bas de page (VNCT.VersionBadge + js/instance.js). Le reste du panneau
         (présentation du bot, « Pour les curieux ») a disparu avec lui : son
         contenu technique est repris, à jour et au bon registre, par
         dashboard/legal/contrat.html. -->

    <!-- Auto-redirect vers le dashboard si un token valide est deja present (session 7j) -->
    <script>
        (function () {
            var t = localStorage.getItem('quasar_token');
            if (!t) return;
            fetch('/auth/me', { headers: { 'Authorization': 'Bearer ' + t } })
                .then(function (r) { return r.json(); })
                .then(function (d) {
                    if (d && d.authenticated) {
                        window.location.replace('/dashboard/app.html');
                    } else {
                        localStorage.removeItem('quasar_token');
                    }
                })
                .catch(function () { /* reseau KO : on laisse la landing */ });
        })();
    </script>

    <script src="/dashboard/js/vnct-common.js?v=__VERSION__"></script>
    <script>
        VNCT.config.serviceName = 'Quasar';
        VNCT.config.serviceVersion = '__VERSION__';
        VNCT.config.devReportUrl = 'https://sema.vena.city';
        VNCT.config.discordWebhookUrl = '/api/feedback/vnct';
    </script>
    <script src="/dashboard/js/instance.js?v=__VERSION__"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/dashboard/sw.js').then(function(reg) {
                reg.update();
            });
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                window.location.reload();
            });
        }
    </script>
    <script>
        // Si deja connecte, rediriger vers le dashboard
        fetch('/auth/me', { credentials: 'include' })
            .then(r => r.json())
            .then(data => {
                if (data.authenticated) {
                    window.location.href = '/dashboard/app.html';
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
