<!DOCTYPE html>
<html lang="fr" data-accent="rose">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quasar — Dashboard</title>
    <link rel="stylesheet" href="/dashboard/css/vnct-design-system.css?v=__VERSION__">
    <link rel="stylesheet" href="/dashboard/css/style.css?v=__VERSION__">
    <link rel="stylesheet" href="/dashboard/css/vnct-fab-only.css?v=__VERSION__">
    <link rel="icon" type="image/x-icon" href="/dashboard/icon.ico">
    <link rel="icon" type="image/png" href="/dashboard/icon.png">
    <link rel="apple-touch-icon" href="/dashboard/icon.png">
    <link rel="manifest" href="/dashboard/manifest.json">
    <meta name="theme-color" content="#0a0a0f" id="meta-theme-color">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Quasar">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-header-left">
                    <div class="sidebar-brand">Qua<span>sar</span></div>
                    <button class="sidebar-guild" id="guild-switcher" type="button" aria-haspopup="true" aria-expanded="false">
                        <span class="sidebar-guild-info" id="guild-info">Chargement...</span>
                        <svg class="sidebar-guild-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                </div>
                <button class="theme-toggle" onclick="VNCT.Theme.toggle()" aria-label="Changer de thème"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>

                <!-- Server menu (popup, ancré sur le bouton serveur) -->
                <div class="server-menu" id="server-menu" hidden>
                    <div class="server-menu-header">
                        <span class="server-menu-title">Tes serveurs</span>
                        <button class="server-menu-refresh" id="server-menu-refresh" type="button" aria-label="Actualiser la liste" title="Actualiser">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                        </button>
                    </div>
                    <div class="server-menu-list" id="server-menu-list" role="listbox"></div>
                    <button class="server-menu-add" id="server-menu-add" type="button">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Ajouter Quasar sur un serveur
                    </button>
                </div>
            </div>

            <div class="sidebar-nav">
                <div class="sidebar-section">Général</div>
                <button class="sidebar-link active" data-page="overview">
                    <span class="sidebar-link-icon">📊</span> Vue d'ensemble
                </button>

                <div class="sidebar-section">Modules</div>
                <button class="sidebar-link" data-page="moderation">
                    <span class="sidebar-link-icon">🛡️</span> Modération
                </button>
                <!-- Repère bêta. Le mot « bêta » est ÉCRIT à côté du triangle :
                     une info portée par la seule forme de l'icône, ou par le
                     seul survol, n'existe ni au doigt ni au clavier. Le `title`
                     n'est donc qu'un confort supplémentaire sur ordinateur, et
                     le complément lecteur d'écran dit la même chose que ce que
                     l'œil voit. Le porteur principal de l'information reste le
                     bandeau en haut de la page. -->
                <button class="sidebar-link" data-page="automod">
                    <span class="sidebar-link-icon">🤖</span> Modération auto
                    <span class="sidebar-badge-beta"
                          title="Modération automatique en bêta : fonctionnalité en cours de test, vos retours sont les bienvenus.">
                        <span class="sidebar-badge-beta-icon" aria-hidden="true">⚠</span>bêta<span class="vnct-sr-only"> — fonctionnalité en cours de test</span>
                    </span>
                </button>
                <button class="sidebar-link" data-page="welcome">
                    <span class="sidebar-link-icon">👋</span> Welcome / Leave
                </button>
                <button class="sidebar-link" data-page="reactionroles">
                    <span class="sidebar-link-icon">🎭</span> Reaction Roles
                </button>
                <button class="sidebar-link" data-page="embeds">
                    <span class="sidebar-link-icon">📝</span> Embeds
                </button>
                <button class="sidebar-link" data-page="customcmds">
                    <span class="sidebar-link-icon">⚡</span> Commandes
                </button>
                <button class="sidebar-link" data-page="tempvoice">
                    <span class="sidebar-link-icon">🎧</span> Vocaux Temp.
                </button>
                <button class="sidebar-link" data-page="tickets">
                    <span class="sidebar-link-icon">🎫</span> Tickets
                </button>
                <button class="sidebar-link" data-page="scheduled">
                    <span class="sidebar-link-icon">⏰</span> Rappels
                </button>
                <button class="sidebar-link" data-page="erasure">
                    <span class="sidebar-link-icon">⚖️</span> Droits des personnes
                </button>
                <!-- Musique désactivée (YouTube/Google bloquent la lecture) — réactiver en décommentant
                <button class="sidebar-link" data-page="music">
                    <span class="sidebar-link-icon">🎵</span> Musique
                </button>
                -->
                <div class="sidebar-section sidebar-section--sep">Système</div>
                <button class="sidebar-link" data-page="update" id="sidebar-update">
                    <span class="sidebar-link-icon">⬆</span> Mise à jour
                </button>
                <!-- Réouverture du pop-up des nouveautés. Volontairement SANS
                     data-page : ce n'est pas une page, c'est une action, et
                     app.js ne doit pas l'inscrire dans sa navigation. Le clic est
                     branché par js/nouveautes.js. Sa place ici, juste sous « Mise
                     à jour », est celle du sujet : la version installée et ce
                     qu'elle apporte se lisent au même endroit. -->
                <button class="sidebar-link" id="sidebar-whatsnew" type="button">
                    <span class="sidebar-link-icon">✨</span> Nouveautés
                </button>
                <!-- Entrées réservées à la propriétaire de l'instance (owner-only) :
                     cachées par défaut, révélées par app.js si /api/presence renvoie isOwner. -->
                <button class="sidebar-link" data-page="owner" id="sidebar-owner" style="display:none">
                    <span class="sidebar-link-icon">🛡️</span> Instance
                </button>
                <button class="sidebar-link" data-page="breach" id="sidebar-breach" style="display:none">
                    <span class="sidebar-link-icon">🚨</span> Notification de violation
                </button>
            </div>

            <div class="sidebar-footer">
                <img class="sidebar-avatar" id="user-avatar" src="" alt="Avatar">
                <span class="sidebar-user" id="user-name">...</span>
                <button class="sidebar-logout" onclick="localStorage.removeItem('quasar_token');window.location.href='/'" title="Déconnexion">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main">
            <!-- Mobile header (visible only on mobile) -->
            <div class="mobile-header">
                <div class="sidebar-brand">Qua<span>sar</span></div>
                <button class="theme-toggle" onclick="VNCT.Theme.toggle()" aria-label="Changer de thème"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>
            </div>
            <div id="content">
                <div class="main-header">
                    <h1 class="main-title">Chargement...</h1>
                </div>
            </div>
        </main>
    </div>

    <!-- Bouton drapeau de signalement. Il vit ici, dans le shell du dashboard,
         et non dans une page : le dashboard rend toutes ses pages dans #content,
         un bouton déclaré dans l'une d'elles disparaîtrait aux autres.
         Pastille iconique (dérogation actée à « texte explicite > icône seule »,
         comme sur les headers de Prisma et de Maât) : le libellé est porté par
         title + aria-label. Le SVG est celui du drapeau de la vitrine
         (public/partials/header.html), pour que les deux surfaces se
         ressemblent. Le clic est câblé par VNCT.Feedback (vnct-common.js), qui
         ouvre la modale unifiée « bug ou idée ». -->
    <button class="vnct-report-fab" type="button" data-vnct-report
            title="Signaler ou proposer" aria-label="Signaler ou proposer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
    </button>

    <script src="/dashboard/js/vnct-common.js?v=__VERSION__"></script>
    <script>
        VNCT.config.serviceName = 'Quasar';
        VNCT.config.serviceVersion = '__VERSION__';
        VNCT.config.devReportUrl = 'https://sema.vena.city';
        VNCT.config.discordWebhookUrl = '/api/feedback/vnct';
    </script>
    <script src="/dashboard/js/instance.js?v=__VERSION__"></script>
    <script src="/dashboard/js/utils.js?v=__VERSION__"></script>
    <script src="/dashboard/js/commandsBlock.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/moderation.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/welcome.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/reactionroles.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/embeds.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/customcmds.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/tempvoice.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/tickets.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/scheduled.js?v=__VERSION__"></script>
    <!-- Modération automatique : le conteneur d'onglets DOIT rester avant les
         fichiers d'onglets, c'est lui qui expose registerAutomodTab. -->
    <script src="/dashboard/js/pages/automod.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/automod-discord.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/automod-escalation.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/automod-antiraid.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/automod-honeypot.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/update.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/erasure.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/breach.js?v=__VERSION__"></script>
    <script src="/dashboard/js/pages/owner.js?v=__VERSION__"></script>
    <script src="/dashboard/js/nouveautes.js?v=__VERSION__"></script>
    <script src="/dashboard/js/contractGate.js?v=__VERSION__"></script>
    <script src="/dashboard/js/app.js?v=__VERSION__"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/dashboard/sw.js').then(function(reg) {
                reg.update();
            });
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                window.location.reload();
            });
        }
    </script>

</body>
</html>
