services:
  quasar:
    build:
      context: .
      args:
        # Le socket Docker de l'hôte est monté plus bas, pour que la mise à jour
        # lancée depuis le dashboard puisse reconstruire l'image. Encore faut-il
        # que le processus node ait le droit de lire ce socket : il lui faut le
        # GID du groupe qui le possède, et ce GID change d'une machine à l'autre
        # (990, 998, 999…). Le Dockerfile portait 972 en dur et personne ne le
        # lui passait jamais : la valeur était donc toujours fausse, et le
        # bouton « Mettre à jour » échouait en « permission denied » au milieu
        # du flux, après que la personne a cliqué.
        # setup.sh détecte le GID et l'écrit dans .env, que compose relit ici —
        # y compris lors de la reconstruction déclenchée depuis le dashboard,
        # qui n'exporte aucune variable (api/services/updater.js).
        DOCKER_GID: ${DOCKER_GID:-972}
    container_name: quasar
    restart: unless-stopped
    # Quasar draine à l'arrêt : serveur HTTP, puis boucles des modules, puis
    # client Discord, puis base, avec un délai dur de 15 s. Docker n'accorde que
    # 10 s par défaut avant le SIGKILL, si bien qu'un drainage qui irait jusqu'au
    # bout serait tué au milieu — précisément le scénario que le drainage existe
    # pour éviter (une notification de violation envoyée mais non marquée en
    # base repart une seconde fois au redémarrage). Le cas nominal se mesure en
    # dizaines de millisecondes ; cette marge ne sert qu'aux mauvais jours.
    stop_grace_period: 20s
    ports:
      # Publié sur la boucle locale par défaut : le dashboard n'est joignable que
      # depuis la machine hôte. Pour l'ouvrir au réseau, mettre BIND_ADDRESS=0.0.0.0
      # dans le .env — décision délibérée (le dashboard donne accès à toute la config
      # du bot et aux données des serveurs).
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - quasar-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/host-app
    env_file: .env
    environment:
      - QUASAR_HOST_DIR=/host-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quasar-data:
    external: true
