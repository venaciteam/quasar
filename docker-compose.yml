services:
  quasar:
    build: .
    container_name: quasar
    restart: unless-stopped
    # Quasar draine à l'arrêt : serveur HTTP, puis boucles des modules, puis
    # client Discord, puis base, avec un délai dur de 15 s. Docker n'accorde que
    # 10 s par défaut avant le SIGKILL, si bien qu'un drainage qui irait jusqu'au
    # bout serait tué au milieu — précisément le scénario que le drainage existe
    # pour éviter (une notification de violation envoyée mais non marquée en
    # base repart une seconde fois au redémarrage). Le cas nominal se mesure en
    # dizaines de millisecondes ; cette marge ne sert qu'aux mauvais jours.
    stop_grace_period: 20s
    ports:
      # Publié sur la boucle locale par défaut : le dashboard n'est joignable que
      # depuis la machine hôte. Pour l'ouvrir au réseau, mettre BIND_ADDRESS=0.0.0.0
      # dans le .env — décision délibérée (le dashboard donne accès à toute la config
      # du bot et aux données des serveurs).
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - quasar-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/host-app
    env_file: .env
    environment:
      - QUASAR_HOST_DIR=/host-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quasar-data:
    external: true
