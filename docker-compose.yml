services:
  quasar:
    build: .
    container_name: quasar
    restart: unless-stopped
    ports:
      # Publié sur la boucle locale par défaut : le dashboard n'est joignable que
      # depuis la machine hôte. Pour l'ouvrir au réseau, mettre BIND_ADDRESS=0.0.0.0
      # dans le .env — décision délibérée (le dashboard donne accès à toute la config
      # du bot et aux données des serveurs).
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - quasar-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/host-app
    env_file: .env
    environment:
      - QUASAR_HOST_DIR=/host-app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  quasar-data:
    external: true
