# Suite de tests sur chaque poussée et chaque PR. Sans elle, la seule
# vérification d'un changement est de lancer le bot et de cliquer partout.
name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci et non install : le lockfile fait foi (better-sqlite3 compile
      # en natif, la version doit être exactement celle testée).
      - run: npm ci
      - run: npm test

  # L'installateur est du shell, que `npm test` exécute mais ne relit pas.
  # shellcheck attrape la classe d'erreurs qui l'a cassé par le passé : une
  # expansion non protégée, un code de retour ignoré, un `read` dont l'échec
  # passe inaperçu. Il est préinstallé sur les runners Ubuntu.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning install.sh setup.sh
