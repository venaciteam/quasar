<!doctype html>
<!-- Gabarit de l'image de partage (1200 × 630), servie à /og-image.jpg. Rendu : voir README.md à côté. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Space Grotesk'; src: url('https://design.vena.city/v2/fonts/space-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'Space Grotesk'; src: url('https://design.vena.city/v2/fonts/space-grotesk-latin-ext-wght-normal.woff2') format('woff2'); font-weight: 300 700; unicode-range: U+0100-024F; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('https://design.vena.city/v2/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('https://design.vena.city/v2/fonts/hanken-grotesk-latin-ext-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0100-024F; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #06060c; color: #ece9f7; font-family: 'Hanken Grotesk', sans-serif; -webkit-font-smoothing: antialiased; }
  /* Halo irisé derrière la fenêtre + trame de points du design system VNCT. */
  body::before { content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 38% 55% at 70% 45%, #ff9ad42e, transparent 70%),
      radial-gradient(ellipse 40% 55% at 92% 75%, #8fe9ff24, transparent 70%),
      radial-gradient(ellipse 30% 40% at 10% 20%, #bfa6ff14, transparent 70%),
      radial-gradient(circle, #ffffff12 1.2px, transparent 1.6px);
    background-size: auto, auto, auto, 24px 24px; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 540px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  .brand img { width: 50px; height: 50px; }
  .iris { background: linear-gradient(90deg, #ff9ad4, #bfa6ff 55%, #8fe9ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 6px rgba(180, 140, 255, .45)); }
  h1 { margin-top: 32px; font-family: 'Space Grotesk', sans-serif; font-size: 60px; font-weight: 700; line-height: 1.06; letter-spacing: -.04em; }
  h1 .iris { padding-bottom: .08em; }
  p { margin-top: 24px; font-size: 22px; line-height: 1.5; color: #a6a3bd; }
  .tags { margin-top: 30px; display: flex; gap: 8px; width: max-content; }
  .tags span { padding: 7px 12px; white-space: nowrap; border: 1px solid #ffffff1f; border-radius: 999px; background: #0d0c14; font-size: 14px; font-weight: 700; letter-spacing: .08em; color: #a6a3bd; }
  .tags .hot { color: #ff9ad4; border-color: #ff9ad473; background: #ff9ad41f; }
  .window { position: absolute; left: 650px; top: 96px; width: 720px; border: 1px solid transparent; border-radius: 22px; overflow: hidden; transform: rotate(-3deg);
    background: linear-gradient(#0d0c14, #0d0c14) padding-box, linear-gradient(135deg, #ff9ad4, #bfa6ff, #8fe9ff) border-box;
    box-shadow: 0 40px 90px #000c, 0 0 46px #bfa6ff40; }
  .bar { height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #ffffff14; font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: .12em; color: #a6a3bd; }
  .dots { display: flex; gap: 8px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: #febc2e; } .dots i:nth-child(2) { background: #28c840; } .dots i:nth-child(3) { background: #ff5f57; }
  .window img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../public/icons/icon-512.png" alt="">Quasar</div>
    <h1>Le bot Discord français,<br><span class="iris">sans palier premium.</span></h1>
    <p>Modération, tickets, rôles par réaction, vocaux temporaires : tout est inclus, avec un dashboard web.</p>
    <div class="tags"><span class="hot">GRATUIT</span><span>OPEN SOURCE</span><span>EN FRANÇAIS</span><span>AUTO-HÉBERGEABLE</span></div>
  </div>
  <div class="window">
    <div class="bar"><span>DASHBOARD</span><span class="dots"><i></i><i></i><i></i></span></div>
    <img src="dashboard.png" alt="">
  </div>
</body>
</html>
