<!--
    Barre du haut commune aux pages de la vitrine (v4.13.0), sur le modèle des
    landings de Polyptyque et de Steam Upgraded : marque à gauche, liens vers
    les parties de l'accueil au centre, actions à droite.

    - Les liens pointent vers /#… et non #… : depuis une page secondaire ils
      ramènent à l'accueil ; depuis l'accueil, le navigateur reste sur la page
      et défile.
    - Drapeau « Signaler ou proposer » : pastille iconique, libellé porté par
      title + aria-label (même dérogation que Maât et Prisma). Ouvre la modale
      VNCT.Feedback du DS, relais /api/feedback/vnct (cf. partials/scripts.html).
    - Menu « … » : partial menu.html, piloté par le DS (VNCT.HeaderMenu). Il
      porte la bascule de thème et les liens légaux.
    - Bouton d'action : « Ouvrir le dashboard » quand l'instance publique est
      ouverte (bloc retiré du HTML sinon, cf. api/services/vnctDs.js), sinon
      « Installer ».
    - Le contenu principal de chaque page porte id="contenu" (lien d'évitement).
-->
<a class="qv-skip" href="#contenu">Aller au contenu</a>
<header class="qv-header">
  <nav class="qv-nav qv-wrap" aria-label="Navigation principale">
    <a class="qv-brand" href="/" aria-label="Quasar, accueil">
      <img src="/icons/icon-192.png?v=__VERSION__" alt="" width="32" height="32">
      <span>Qua<span class="qv-iris">sar</span></span>
    </a>
    <ul class="qv-links">
      <li><a href="/#principe">Le principe</a></li>
      <li><a href="/#dashboard">Le dashboard</a></li>
      <li><a href="/#modules">Les modules</a></li>
      <li><a href="/#installer">Installer</a></li>
      <li><a href="/#questions">Questions</a></li>
    </ul>
    <div class="qv-nav__actions">
      <button class="vnct-header__icon" type="button" data-quasar-action="report" title="Signaler ou proposer" aria-label="Signaler ou proposer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
      </button>
      {{> menu}}
      <!-- __DASHBOARD_CTA_ON__ -->
      <a class="qv-btn qv-btn--primary qv-btn--sm qv-nav__cta" href="/dashboard">Ouvrir le dashboard</a>
      <!-- /__DASHBOARD_CTA_ON__ -->
      <a class="qv-btn qv-btn--ghost qv-btn--sm qv-nav__cta qv-cta-off" href="/#installer">Installer</a>
    </div>
  </nav>
</header>
